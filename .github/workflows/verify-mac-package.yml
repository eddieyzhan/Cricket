name: Verify existing Mac DMG (manual only)
on:
  workflow_dispatch:
    inputs:
      release:
        type: string
        required: true
        default: v0.1.3
permissions:
  # GitHub hides draft releases from tokens without repository write permission.
  # This workflow only downloads the existing package; it never publishes.
  contents: write
jobs:
  verify:
    if: github.event.repository.private == false
    runs-on: macos-14
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Fetch existing Codemagic package (no rebuild)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release }}
        run: gh release download "$RELEASE_TAG" --pattern '*aarch64.dmg' --dir src-tauri/target/release/bundle/dmg
      - name: Verify relocated package startup
        run: node tools/test-macos-package.mjs
