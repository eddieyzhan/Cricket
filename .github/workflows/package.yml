name: Package desktop preview (manual only)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platforms to build (choose one when retrying a failed job)
        type: choice
        options: [all, linux-and-intel, linux, macos-arm64, macos-intel]
        default: all
      release:
        description: Existing draft release tag to attach packages to
        type: string
        default: v0.1.3
        required: true

# No push/PR/schedule trigger, cache uploads, or Actions artifact storage.
# Standard public-repository runners only; never run this workflow privately.
permissions:
  contents: write

concurrency:
  group: cricket-packages-${{ inputs.platform }}
  cancel-in-progress: false

jobs:
  package:
    if: github.event.repository.private == false
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.platform == 'all' && '[{"platform":"linux","os":"ubuntu-22.04"},{"platform":"macos-arm64","os":"macos-14"},{"platform":"macos-intel","os":"macos-15-intel"}]' || inputs.platform == 'linux-and-intel' && '[{"platform":"linux","os":"ubuntu-22.04"},{"platform":"macos-intel","os":"macos-15-intel"}]' || inputs.platform == 'linux' && '[{"platform":"linux","os":"ubuntu-22.04"}]' || inputs.platform == 'macos-arm64' && '[{"platform":"macos-arm64","os":"macos-14"}]' || '[{"platform":"macos-intel","os":"macos-15-intel"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      CARGO_TERM_COLOR: always
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libdbus-1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2
      - name: Rust toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
      - name: Install locked frontend dependencies and verified croc
        run: |
          npm ci
          npm run prepare:croc
      - name: Verify relay fallback with a nested folder
        run: node tools/test-croc.mjs --folder --force-relay
      - name: Native tests (reuse the release profile for packaging)
        run: node tools/native.mjs cargo test --release --locked --manifest-path src-tauri/Cargo.toml --lib -- --include-ignored
      - name: Build native packages
        run: npm run tauri -- build
      - name: Check public files and compiled paths
        run: node tools/audit-public.mjs src-tauri/target/release/cricket
      - name: Check relocated Mac package startup
        if: runner.os == 'macOS'
        run: node tools/test-macos-package.mjs
      - name: Attach packages directly to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release }}
        shell: bash
        run: |
          shopt -s nullglob
          packages=(src-tauri/target/release/bundle/{deb,appimage,dmg}/*.{deb,AppImage,dmg})
          if [ "${#packages[@]}" -eq 0 ]; then
            echo 'No desktop packages were produced.' >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${packages[@]}" --clobber
